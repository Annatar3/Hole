name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run CLI smoke tests
        run: npm run test:cli

      - name: Run local E2E tests
        run: npm run test:e2e

      - name: Build binaries
        run: npm run build

      - name: Smoke packaged Linux binary
        run: dist/hole-linux-x64 help
